# The Keycloak server version this plugin is validated against.
#
# Single source of truth: the CI checks in .github/scripts/ read it from here, so bumping the
# server means changing one line and letting the classpath + smoke checks re-run against it.
#
# Keep this in sync with the Keycloak image the plugin is actually deployed onto. As of 2026-08-20
# that is 26.4.6 (daikin-dsv/deploy, ssi/environments/clusters/ss-bedrock-prod.yaml).
keycloakServerVersion=26.4.6
